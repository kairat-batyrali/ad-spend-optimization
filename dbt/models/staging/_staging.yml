version: 2
models:
  - name: stg_campaigns
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['Google Search', 'Meta', 'TikTok', 'YouTube']
  - name: stg_daily_performance
    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id
      - name: date
        data_tests: [not_null]
  - name: stg_weekly_sales
    columns:
      - name: week_start
        data_tests: [unique, not_null]
  - name: stg_promotions
    columns:
      - name: week_start
        data_tests: [unique, not_null]
